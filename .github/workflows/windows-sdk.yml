name: Prepare Windows SDK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved SDK settings commit SHA (empty uses main)
        type: string
        required: false
        default: ''
      export_snapshot:
        description: Export the existing SDK cache as an archive (no source build)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-windows-sdk
  cancel-in-progress: false

jobs:
  sdk:
    name: Prepare SDK cache in main
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && !inputs.export_snapshot
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Select immutable SDK inputs
        id: source
        shell: python
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          import os, re
          from pathlib import Path
          sha = os.environ['SOURCE_SHA'] or os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Use a full approved commit SHA')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
      - name: Trusted SDK preparation action from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/actions/windows-sdk
          persist-credentials: false
      - name: Approved SDK manifest and triplets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: sdk-inputs
          sparse-checkout: |
            vcpkg.json
            cmake/triplets
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-tools/.github/actions/windows-sdk
        with:
          manifest-directory: sdk-inputs

  snapshot:
    name: Archive existing SDK packages
    if: github.actor == github.repository_owner && inputs.export_snapshot
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-sdk
        with:
          binary-only: 'true'
      - name: Preserve only installed packages and provenance
        run: python scripts/windows_sdk.py pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sdk-snapshot
          path: |
            out/windows-sdk-2026.1.zip
            out/windows-sdk-2026.1.json
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
