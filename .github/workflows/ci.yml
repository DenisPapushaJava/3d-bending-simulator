name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Quality and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/version.py --check-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Check release version rules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check C++ formatting
        run: find src tests -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  build:
    name: Build (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/install-linux-deps.sh
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $environment = & "$vs/Common7/Tools/VsDevCmd.bat" -arch=x64 -host_arch=x64 '&&' set
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Qt 6.8.3 (shared libraries)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Pinned vcpkg
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 256310531c1e57ee83f8ac01f7bea7c1e56630f5
          path: .deps/vcpkg
          persist-credentials: false
      - name: Cache OCCT binaries
        if: runner.os == 'Windows'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/vcpkg
          key: vcpkg-windows-2022-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake --preset release
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          cmake --preset release "-DCMAKE_TOOLCHAIN_FILE=$pwd/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release "-DVCPKG_OVERLAY_TRIPLETS=$pwd/cmake/triplets" "-DVCPKG_INSTALLED_DIR=$pwd/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test core, OCCT and app startup
        run: ctest --preset release
      - name: Package Ubuntu 24.04 / Mint 22 .deb
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cd build/release
          cpack -G DEB -B ../../out
          cd ../..
          dpkg-deb --info out/*.deb
          dpkg-deb --extract out/*.deb out/linux-check
          QT_QPA_PLATFORM=offscreen out/linux-check/usr/bin/3d-bending-simulator --smoke-test
      - name: Package Windows and corresponding sources
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: python scripts/package_windows.py --qt-root "$env:QT_ROOT_DIR" --vcpkg-root "$pwd/.deps/vcpkg"
      - name: Checksums
        if: github.event_name != 'pull_request'
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          paths = sorted(p for p in Path('out').iterdir() if p.suffix in {'.zip', '.deb'})
          with Path('out/SHA256SUMS-${{ runner.os }}.txt').open('w') as out:
              for path in paths:
                  out.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
      - name: Build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            out/*.zip
            out/*.deb
            out/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a project license before release
        run: test -f LICENSE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        run: |
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --json isDraft > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "3D Bending Simulator $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
