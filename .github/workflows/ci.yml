name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sdk_archive_only:
        description: Verify Windows SDK from the durable archive without Actions cache or source builds
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Quality and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      build: ${{ steps.scope.outputs.build }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fingerprint build inputs
        id: fingerprint
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"
      - name: Restore successful CI proof
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-validated
          key: ci-validated-v1-${{ steps.fingerprint.outputs.fingerprint }}
      - name: Select build scope
        id: scope
        run: python3 scripts/ci_scope.py --proof "$RUNNER_TEMP/ci-validated/fingerprint" --github-output "$GITHUB_OUTPUT"
      - name: Validate version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/version.py --check-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Check release version rules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check C++ formatting
        if: steps.scope.outputs.build == 'true'
        run: find src tests tools -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Check domain without Qt or OCCT
        if: steps.scope.outputs.build == 'true'
        run: |
          cmake --preset core --no-warn-unused-cli -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON -DCMAKE_DISABLE_FIND_PACKAGE_OpenCASCADE=ON
          cmake --build --preset core --parallel 2
          ctest --preset core

  build:
    name: Build (${{ matrix.os }})
    needs: quality
    if: needs.quality.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/install-linux-deps.sh
      - name: Windows SDK
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-sdk
        with:
          use-actions-cache: ${{ inputs.sdk_archive_only != true }}
          binary-only: ${{ inputs.sdk_archive_only == true }}
      - name: Qt 6.8.3 (shared libraries)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake --preset release
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --preset release "-DCMAKE_TOOLCHAIN_FILE=$pwd/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release "-DVCPKG_OVERLAY_TRIPLETS=$pwd/cmake/triplets" "-DVCPKG_INSTALLED_DIR=$pwd/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test core, OCCT and app startup
        run: ctest --preset release
      - name: Package Windows and corresponding sources
        if: runner.os == 'Windows' && needs.quality.outputs.package == 'true'
        shell: pwsh
        run: python scripts/package_windows.py --qt-root "$env:QT_ROOT_DIR" --vcpkg-root "$pwd/.deps/vcpkg"
      - name: Checksums
        if: runner.os == 'Windows' && needs.quality.outputs.package == 'true'
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          paths = sorted(Path('out').glob('*.zip'))
          if not paths:
              raise SystemExit('Windows release ZIPs are missing')
          with Path('out/SHA256SUMS.txt').open('w') as out:
              for path in paths:
                  out.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
      - name: Build artifacts
        if: runner.os == 'Windows' && needs.quality.outputs.package == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            out/*.zip
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or validated reuse
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          BUILD_REQUIRED: ${{ needs.quality.outputs.build }}
        run: |
          test "$QUALITY" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD" = skipped
          fi
      - name: Record successful full validation
        if: needs.quality.outputs.build == 'true'
        shell: python
        env:
          FINGERPRINT: ${{ needs.quality.outputs.fingerprint }}
        run: |
          import os
          from pathlib import Path
          proof = Path(os.environ['RUNNER_TEMP']) / 'ci-validated'
          proof.mkdir(parents=True, exist_ok=True)
          (proof / 'fingerprint').write_text(os.environ['FINGERPRINT'] + '\n', encoding='ascii')
      - name: Save successful CI proof
        if: needs.quality.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-validated
          key: ci-validated-v1-${{ needs.quality.outputs.fingerprint }}

  release:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [quality, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a project license before release
        run: test -f LICENSE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release-assets
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        run: |
          python3 scripts/version.py --release-notes .release-notes.md
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --json isDraft > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "3D Bending Simulator $RELEASE_TAG" --notes-file .release-notes.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
